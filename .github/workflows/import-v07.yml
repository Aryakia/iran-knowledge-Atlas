name: Import protected atlas v0.7.0

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/import-v07.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified public-only artifact
        env:
          ATLAS_URL: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-094c-81fd-8e7a-97b2fb223764/raw?se=2026-10-05T04%3A36%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=d1324493-6618-5e4b-800d-6a74aa055dd4&skoid=2d2fbb03-9efb-4ad0-a91c-1db2f5a47997&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T12%3A38%3A46Z&ske=2026-10-05T12%3A38%3A46Z&sks=b&skv=2026-02-06&sig=kco8aDpUGTcFR5QRVX319W8OxxqFd8Dg2vD%2By8A0SmM%3D"
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$ATLAS_URL" -o "$RUNNER_TEMP/atlas.zip"
          echo "7e8ff7dbffb27f715d242754ed8a943fc24e26fc2b86f7ad3cf97669bf32bbc3  $RUNNER_TEMP/atlas.zip" | sha256sum -c -
          rm -rf "$RUNNER_TEMP/atlas" atlas
          mkdir -p "$RUNNER_TEMP/atlas" atlas
          unzip -q "$RUNNER_TEMP/atlas.zip" -d "$RUNNER_TEMP/atlas"
          rsync -a --exclude='.github/' --exclude='README.md' "$RUNNER_TEMP/atlas/" atlas/
      - name: Commit audited v0.7 atlas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas
          if git diff --cached --quiet; then
            echo "Atlas already current."
          else
            git commit -m "Publish protected atlas v0.7.0"
            git push
          fi
