name: Deploy showcase and public atlas to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Stage Pages site
        run: |
          set -euo pipefail
          test -f index.html
          test -f atlas/index.html
          test -f atlas/data/public-atlas.json
          test -f atlas/data/public-scenarios.json
          test -f atlas/public-build-manifest.json
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp -R docs _site/docs
          cp -R atlas _site/atlas
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - id: deployment
        uses: actions/deploy-pages@v4
